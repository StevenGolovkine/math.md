<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="130" viewBox="0 0 720 130" role="img" aria-labelledby="title desc">
  <title id="title">Union of closed intervals from 0 to 1 and from 3 to 7 with length 5</title>
  <desc id="desc">A number line showing the union [0, 1] union [3, 7], with component lengths 1 and 4 and a label saying total length equals 1 plus 4 equals 5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .axis {
        stroke: #1f2937;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .tick {
        stroke: #1f2937;
        stroke-width: 2;
        stroke-linecap: round;
      }

      .interval {
        stroke: #2563eb;
        stroke-width: 10;
        stroke-linecap: round;
      }

      .endpoint {
        fill: #2563eb;
        stroke: #ffffff;
        stroke-width: 3;
      }

      .measure {
        stroke: #334155;
        stroke-width: 3;
        stroke-linecap: round;
        marker-start: url(#arrow);
        marker-end: url(#arrow);
      }

      .label {
        fill: #111827;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        text-anchor: middle;
      }

      .small-label {
        fill: #374151;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="720" height="130" fill="#ffffff"/>

  <text class="label" x="360" y="24">length = 5</text>

  <line class="axis" x1="80" y1="78" x2="640" y2="78"/>

  <g class="ticks">
    <line class="tick" x1="80" y1="66" x2="80" y2="90"/>
    <line class="tick" x1="160" y1="66" x2="160" y2="90"/>
    <line class="tick" x1="240" y1="66" x2="240" y2="90"/>
    <line class="tick" x1="320" y1="66" x2="320" y2="90"/>
    <line class="tick" x1="400" y1="66" x2="400" y2="90"/>
    <line class="tick" x1="480" y1="66" x2="480" y2="90"/>
    <line class="tick" x1="560" y1="66" x2="560" y2="90"/>
    <line class="tick" x1="640" y1="66" x2="640" y2="90"/>
  </g>

  <g class="number-labels">
    <text class="small-label" x="80" y="118">0</text>
    <text class="small-label" x="160" y="118">1</text>
    <text class="small-label" x="240" y="118">2</text>
    <text class="small-label" x="320" y="118">3</text>
    <text class="small-label" x="400" y="118">4</text>
    <text class="small-label" x="480" y="118">5</text>
    <text class="small-label" x="560" y="118">6</text>
    <text class="small-label" x="640" y="118">7</text>
  </g>

  <line class="interval" x1="80" y1="78" x2="160" y2="78"/>
  <line class="interval" x1="320" y1="78" x2="640" y2="78"/>

  <circle class="endpoint" cx="80" cy="78" r="12"/>
  <circle class="endpoint" cx="160" cy="78" r="12"/>
  <circle class="endpoint" cx="320" cy="78" r="12"/>
  <circle class="endpoint" cx="640" cy="78" r="12"/>

  <line class="measure" x1="80" y1="45" x2="160" y2="45"/>
  <text class="small-label" x="120" y="39">1</text>

  <line class="measure" x1="320" y1="45" x2="640" y2="45"/>
  <text class="small-label" x="480" y="39">4</text>
</svg>
