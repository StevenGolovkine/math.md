<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="100" viewBox="0 0 720 100" role="img" aria-labelledby="title desc">
  <title id="title">Closed interval from 2 to 5 with length 3</title>
  <desc id="desc">A number line showing the closed interval [2, 5] and an arrow labeled length equals 5 minus 2 equals 3.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .axis {
        stroke: #1f2937;
        stroke-width: 3;
        stroke-linecap: round;
      }

      .tick {
        stroke: #1f2937;
        stroke-width: 2;
        stroke-linecap: round;
      }

      .interval {
        stroke: #2563eb;
        stroke-width: 10;
        stroke-linecap: round;
      }

      .endpoint {
        fill: #2563eb;
        stroke: #ffffff;
        stroke-width: 3;
      }

      .measure {
        stroke: #334155;
        stroke-width: 3;
        stroke-linecap: round;
        marker-start: url(#arrow);
        marker-end: url(#arrow);
      }

      .label {
        fill: #111827;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        text-anchor: middle;
      }

      .small-label {
        fill: #374151;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="720" height="100" fill="#ffffff"/>

  <line class="axis" x1="90" y1="60" x2="630" y2="60"/>

  <g class="ticks">
    <line class="tick" x1="90" y1="48" x2="90" y2="72"/>
    <line class="tick" x1="180" y1="48" x2="180" y2="72"/>
    <line class="tick" x1="270" y1="48" x2="270" y2="72"/>
    <line class="tick" x1="360" y1="48" x2="360" y2="72"/>
    <line class="tick" x1="450" y1="48" x2="450" y2="72"/>
    <line class="tick" x1="540" y1="48" x2="540" y2="72"/>
    <line class="tick" x1="630" y1="48" x2="630" y2="72"/>
  </g>

  <g class="number-labels">
    <text class="small-label" x="90" y="90">0</text>
    <text class="small-label" x="180" y="90">1</text>
    <text class="small-label" x="270" y="90">2</text>
    <text class="small-label" x="360" y="90">3</text>
    <text class="small-label" x="450" y="90">4</text>
    <text class="small-label" x="540" y="90">5</text>
    <text class="small-label" x="630" y="90">6</text>
  </g>

  <line class="interval" x1="270" y1="60" x2="540" y2="60"/>
  <circle class="endpoint" cx="270" cy="60" r="12"/>
  <circle class="endpoint" cx="540" cy="60" r="12"/>


  <line class="measure" x1="270" y1="30" x2="540" y2="30"/>
  <text class="label" x="405" y="20">length = 3</text>
</svg>
